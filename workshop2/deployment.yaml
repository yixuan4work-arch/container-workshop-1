apiVersion: v1
kind: Namespace
metadata:
  name: bggns

---
apiVersion: v1
kind: Secret
metadata:
  name: bggdb-secret
  namespace: bggns
data:
  BGG_DB_PASSWORD: Y2hhbmdlaXQ=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggdb-deploy
  namespace: bggns
spec:
  replicas: 1
  selector:
    matchLabels:
      name: bggdb
  template:
    metadata:
      name: bggdb-pod
      labels:
        name: bggdb
    spec:
      containers:
      - name: bggdb
        image: stackupiss/bgg-database:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bggapp-deploy
  namespace: bggns
spec:
  replicas: 3
  selector:
    matchLabels:
      name: bggapp
  template:
    metadata:
      name: bggapp-pod
      labels:
        name: bggapp
    spec:
      containers:
      - name: bggapp
        image: stackupiss/bgg-backend:v2
        imagePullPolicy: Always
        env:
        - name: BGG_DB_USER
          value: root
        - name: BGG_DB_HOST
          value: bggdb-svc.bggns.svc.cluster.local
        - name: BGG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bggdb-secret
              key: BGG_DB_PASSWORD
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: bggdb-svc
  namespace: bggns
spec:
  type: ClusterIP
  selector:
    name: bggdb
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bggapp-svc
  namespace: bggns
spec:
  type: NodePort
  selector:
    name: bggapp
  ports:
  - port: 8080
    targetPort: 3000
