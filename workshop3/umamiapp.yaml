---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamiapp-deploy
  namespace: workshop03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umamiapp
  template:
    metadata:
      labels:
        app: umamiapp
    spec:
      containers:
      - name: umamiapp-container
        image: ghcr.io/umami-software/umami:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: umamidb-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: umamidb-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: umamidb-secret
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@umamidb-svc:5432/$(POSTGRES_DB)
        - name: APP_SECRET
          valueFrom:
            secretKeyRef:
              name: umamiapp-secret
              key: APP_SECRET
        ports:
        - name: http-port
          containerPort: 3000
        startupProbe:
          httpGet:
            path: /api/heartbeat
            port: http-port
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/heartbeat
            port: http-port
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/heartbeat
            port: http-port
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            memory: 512Mi
            cpu: 256m
          limits:
            memory: 512Mi
            cpu: 256m
