---
apiVersion: v1
kind: Namespace
metadata:
  name: workshop03

---
apiVersion: v1
kind: Secret
metadata:
  name: umamidb-secret
  namespace: workshop03
stringData:
  POSTGRES_USER: umami
  POSTGRES_PASSWORD: mydbpassword
  POSTGRES_DB: umami

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umamidb-pvc
  namespace: workshop03
spec:
  storageClassName: standard
  accessModes:
  # only one pod mount the volume at a time
  - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umamidb-deploy
  namespace: workshop03
spec:
  replicas: 1
  strategy:
    # old pod must release the volume before the new pod starts
    type: Recreate
  selector:
    matchLabels:
      app: umamidb
  template:
    metadata:
      labels:
        app: umamidb
    spec:
      volumes:
      - name: db-vol
        persistentVolumeClaim:
          claimName: umamidb-pvc
      containers:
      - name: umamidb-container
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: umamidb-secret
        env:
        # postgres won't init in a non-empty dir (e.g. lost+found), so use a subdir
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: db-port
          containerPort: 5432
        volumeMounts:
        - name: db-vol
          mountPath: /var/lib/postgresql/data
        resources: {}
