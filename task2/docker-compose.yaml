volumes:
  # docker volum create data-vol
  data-vol:

networks:
  # docker network create mynet
  mynet:

services:
  # docker run -d --volume type=volume,src=data-vol,dst=//var/lib/mysql --name=db stackupiss/northwind-db:v1
  db:
    # mysql image
    image: stackupiss/northwind-db:v1
    networks:
    - mynet
    volumes:
    - data-vol:/var/lib/mysql

  # docker run -d -p 8080:3000 --name=app --network=mynet \
  #  -e DB_HOST=db -d DB_USER=root -d DB_PASSWORD=changeit stackupiss/northwind-app:v1
  app:
    image: stackupiss/northwind-app:v1
    networks:
    - mynet
    environment:
    - DB_HOST=db
    - DB_USER=root
    - DB_PASSWORD=changeit
    ports:
    - 8888:3000